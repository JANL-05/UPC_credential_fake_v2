workflows:
  ios-adhoc:
    name: iOS Ad-Hoc (Distribución directa)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.tuapp.credencialestudiantil  # ← cambia esto
    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Flutter build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - chatgptito2025@gmail.com  # ← tu email para recibir el IPA
        notify:
          success: true
          failure: true
